services:
  traefik:
    image: traefik:v3.5
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --entrypoints.web.address=:80
      # DEMO ONLY: accept X-Forwarded-For from any peer so arbitrary client
      # addresses can be simulated with curl. Never enable this in production.
      - --entryPoints.web.forwardedHeaders.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --experimental.localPlugins.threatdb.moduleName=github.com/kallisti5/threatdb
    ports:
      - "8000:80"
      - "8080:8080"
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../:/plugins-local/src/github.com/kallisti5/threatdb:ro

  whoami:
    image: traefik/whoami:v1.10
